global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: studak-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:9091
        labels:
          application: studak
          environment: docker

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
